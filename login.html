<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Quotes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
  <div class="bg-gradient"></div>
  <div class="bg-gradient bg-gradient-2"></div>
  <div class="bg-noise"></div>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-ring">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
    <p class="loading-text">Loading...</p>
  </div>

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <i class="fas fa-quote-left"></i>
        <span>Quotes</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="login.html" class="nav-link active">Admin</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-card glass-card">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fas fa-shield-halved"></i>
        </div>
        <h1 class="auth-title">Admin Login</h1>
        <p class="auth-subtitle">Sign in to manage quotes</p>
      </div>
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="emailInput">Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="emailInput" placeholder="admin@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" style="display: none;">
            <div class="loading-ring small">
              <div></div>
              <div></div>
              <div></div>
              <div></div>
            </div>
          </span>
        </button>
      </form>
      <div class="auth-footer">
        <a href="index.html" class="back-link">
          <i class="fas fa-arrow-left"></i>
          Back to Quotes
        </a>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
