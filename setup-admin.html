
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Admin Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(20px);
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #a0a0b0; font-size: 0.9rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #a0a0b0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #f0f0f5;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.2); }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .message.success { background: rgba(34,197,94,0.15); color: #22c55e; display: block; }
    .message.error { background: rgba(239,68,68,0.15); color: #ef4444; display: block; }
    .note {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.8rem;
      color: #6a6a7a;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Admin Account</h1>
    <p>One-time setup. Delete this file after use.</p>
    <form id="signupForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat password" required>
      </div>
      <button type="submit" id="submitBtn">Create Account</button>
    </form>
    <div class="message" id="message"></div>
    <div class="note">
      After creating your account, go to <strong>login.html</strong> to sign in.
      Then <strong>delete this setup-admin.html file</strong> from your server.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const msg = document.getElementById('message');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        show('Passwords do not match', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await client.auth.signUp({ email, password });

        if (error) throw error;

        show('Account created! Check your email for confirmation (if enabled), then go to login.html.', 'success');
        form.reset();
      } catch (err) {
        show(err.message || 'Failed to create account', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });

    function show(text, type) {
      msg.textContent = text;
      msg.className = 'message ' + type;
    }
  </script>
</body>
</html>
